[project]
name = "reels"
version = "1.0.0"
description = "Automated 2D doodle Instagram Reels pipeline (local-first)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "numpy>=1.26",
  "soundfile>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pillow>=10.3",
]

[project.optional-dependencies]
# Apple Silicon (MLX) stack - installed by setup/macos.sh
mac = [
  "mlx-whisper>=0.4",
  "mlx-audio>=0.2",
  "mlx-lm>=0.20",
]
# cross-platform torch stack (also works on macOS via MPS)
torch = [
  "kokoro>=0.9",
  "faster-whisper>=1.0",
]
claude = ["anthropic>=0.60"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
reels = "reels.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reels"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
