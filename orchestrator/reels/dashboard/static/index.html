<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doodle Reels Review</title>
<style>
  :root { --paper:#F7F3E8; --ink:#1B1B1B; --accent:#E63946; --ok:#2A9D8F; --warn:#E9A23B; --muted:#6b6b6b; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:14px 20px; border-bottom:3px solid var(--ink); background:#fff; position:sticky; top:0; z-index:2; }
  header h1 { font-size:20px; margin:0; letter-spacing:.02em; }
  nav button { border:2px solid var(--ink); background:#fff; padding:6px 12px; border-radius:999px; cursor:pointer; font-weight:600; }
  nav button.on { background: var(--ink); color:#fff; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:0; min-height: calc(100vh - 60px); }
  #list { border-right:3px solid var(--ink); overflow:auto; max-height: calc(100vh - 60px); }
  .item { padding:12px 16px; border-bottom:1px solid #ddd; cursor:pointer; }
  .item:hover, .item.sel { background:#fff; }
  .item .t { font-weight:700; }
  .item .s { font-size:12px; color:var(--muted); }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; border:1.5px solid var(--ink); margin-right:4px; }
  .pass { background:#d6f2ee; } .warn { background:#fdebc8; } .fail { background:#f8d0d3; } .skip { background:#eee; }
  #detail { padding:20px; overflow:auto; max-height: calc(100vh - 60px); }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  video { width: 300px; aspect-ratio: 9/16; background:#000; border:3px solid var(--ink); border-radius:12px; }
  .card { background:var(--card); border:2px solid var(--ink); border-radius:12px; padding:14px 16px; margin-bottom:14px; flex:1; min-width: 320px; }
  .card h3 { margin:0 0 8px; font-size:15px; }
  .line { margin:4px 0; } .line b { display:inline-block; min-width:80px; }
  .beat { font-size:11px; color:var(--muted); text-transform:uppercase; margin-right:6px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .actions button, .actions select, .actions input { border:2px solid var(--ink); border-radius:8px; padding:8px 12px; font-weight:700; background:#fff; cursor:pointer; }
  .approve { background: var(--ok) !important; color:#fff; }
  .reject { background: var(--accent) !important; color:#fff; }
  table { border-collapse: collapse; width:100%; } td { padding:4px 6px; border-bottom:1px solid #eee; vertical-align:top; }
  .empty { color: var(--muted); padding:40px; text-align:center; }
  .rig { position:relative; display:inline-block; border:2px solid var(--ink); border-radius:8px; background:#fff; margin:6px; }
  .rig img { display:block; max-height: 420px; }
  .dot { position:absolute; width:14px; height:14px; margin:-7px; border-radius:50%; border:2px solid #fff; }
  .mouth { background: var(--accent); } .eye { background: var(--ok); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } #list { max-height: 40vh; border-right:0; border-bottom:3px solid var(--ink);} }
</style>
</head>
<body>
<header>
  <h1>✏️ Doodle Reels</h1>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Pick an episode</div></div>
</main>
<script>
const TABS = { Review: "review", "QA failed": "qa_failed", Scheduled: "scheduled", Published: "published", "In progress": "new,scripted,boarded,assets,voiced,aligned,timeline,rendered,failed,rejected", All: "", Characters: "@chars", Stats: "@stats" };
const STEPS = ["script","storyboard","assets","tts","align","timeline","render","qa"];
let tab = "Review", selected = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join(" ");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; selected = null; load(); });
}

async function load() {
  renderTabs();
  const v = TABS[tab];
  if (v === "@chars") return loadChars();
  if (v === "@stats") return loadStats();
  const eps = await api(`/api/episodes?status=${encodeURIComponent(v)}`);
  $("#list").innerHTML = eps.length ? eps.map(e => `
    <div class="item ${selected===e.ref?"sel":""}" data-ref="${esc(e.ref)}">
      <div class="t">${esc(e.title || e.id)}</div>
      <div class="s"><span class="pill">${esc(e.status)}</span>${e.qa?`<span class="pill ${e.qa}">QA ${e.qa}</span>`:""}${esc(e.series)} · ${esc(e.created_at.slice(0,16).replace("T"," "))}${e.scheduled_at?` · ⏰ ${esc(e.scheduled_at.slice(0,16).replace("T"," "))}`:""}${e.job?` · ${esc(e.job)}`:""}</div>
    </div>`).join("") : `<div class="empty">Nothing here</div>`;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => { selected = el.dataset.ref; load(); show(selected); });
  if (!selected) $("#detail").innerHTML = `<div class="empty">Pick an episode</div>`;
}

async function show(ref) {
  const [s, id] = ref.split("/");
  const d = await api(`/api/episodes/${s}/${id}`);
  const m = d.meta;
  const lines = (d.script?.lines || []).map(l => `<div class="line"><span class="beat">${esc(l.beat)}</span><b>${esc(l.speaker)}</b> ${esc(l.text)}</div>`).join("");
  const qa = (d.qa?.checks || []).map(c => `<tr><td><span class="pill ${c.status}">${c.status}</span></td><td>${esc(c.name)}</td><td>${esc(c.detail)}</td></tr>`).join("");
  $("#detail").innerHTML = `
    <div class="row">
      <div>${m.status && d.qa ? `<video src="/media/${s}/${id}/video" controls playsinline></video>` : `<div class="empty">no render yet</div>`}</div>
      <div style="flex:1;min-width:320px">
        <div class="card">
          <h3>${esc(m.title)}</h3>
          <div class="s">${esc(ref)} · <span class="pill">${esc(m.status)}</span> ${m.error?`<span class="pill fail">${esc(m.error)}</span>`:""}</div>
          ${d.idea?`<p><b>Hook:</b> ${esc(d.idea.hook)}<br><b>Formula:</b> ${esc(d.idea.formula_id)} · <b>score</b> ${Number(d.idea.total).toFixed(2)}</p>`:""}
          <div class="actions">
            <button class="approve" id="ap">Approve → next slot</button>
            <input type="datetime-local" id="at" />
            <button id="apAt">Schedule at</button>
            <button id="now">Publish now</button>
            ${m.status==="scheduled"?`<button id="unsch">Unschedule</button>`:""}
          </div>
          <div class="actions">
            <input id="note" placeholder="reject note" style="flex:1" />
            <select id="rerun"><option value="">no regenerate</option>${STEPS.map(x=>`<option value="${x}">regenerate from ${x}</option>`).join("")}</select>
            <button class="reject" id="rj">Reject</button>
          </div>
        </div>
        <div class="card"><h3>QA ${d.qa?`<span class="pill ${d.qa.status}">${d.qa.status}</span>`:""}</h3><table>${qa || "<tr><td>not run</td></tr>"}</table></div>
        <div class="card"><h3>Script</h3>${lines || "—"}<p class="s">${esc(d.script?.caption || "")}</p></div>
      </div>
    </div>`;
  const post = (path, body) => api(`/api/episodes/${s}/${id}/${path}`, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body) }).then(load).then(() => show(ref)).catch(e => alert(e.message));
  $("#ap").onclick = () => post("approve", {});
  $("#apAt").onclick = () => { const v = $("#at").value; if (v) post("approve", { at: new Date(v).toISOString() }); };
  $("#now").onclick = () => { if (confirm("Publish to Instagram now?")) post("approve", { now: true }); };
  $("#rj").onclick = () => post("reject", { note: $("#note").value, rerun: $("#rerun").value || null });
  if ($("#unsch")) $("#unsch").onclick = () => post("unschedule", {});
}

async function loadStats() {
  const st = await api("/api/stats");
  $("#list").innerHTML = `<div class="empty">Formula performance learned from analytics</div>`;
  $("#detail").innerHTML = Object.entries(st).map(([sid, v]) => `
    <div class="card"><h3>${esc(sid)}</h3>
      <table>${Object.entries(v.priors).sort((a,b)=>b[1]-a[1]).map(([k,x]) => `<tr><td>${esc(k)}</td><td>${x>=0?"+":""}${x.toFixed(3)}</td></tr>`).join("") || "<tr><td>no analytics yet</td></tr>"}</table>
      <h3 style="margin-top:12px">Top hooks</h3>
      <table>${v.top_hooks.map(([h,s]) => `<tr><td>${esc(h)}</td><td>${Number(s).toFixed(2)}</td></tr>`).join("") || "<tr><td>—</td></tr>"}</table>
    </div>`).join("");
}

async function loadChars() {
  const chars = await api("/api/characters");
  $("#list").innerHTML = chars.map(c => `<div class="item" data-id="${esc(c.id)}"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.series)} · ${c.rig ? Object.keys(c.rig.poses).length + " poses" : "procedural (no rig yet)"}</div></div>`).join("");
  document.querySelectorAll(".item").forEach(el => el.onclick = () => rigEditor(chars.find(c => c.id === el.dataset.id)));
  $("#detail").innerHTML = `<div class="empty">Pick a character. Click a pose to place the <b style="color:var(--accent)">mouth</b>; shift-click to add <b style="color:var(--ok)">eyes</b> (alt-click clears eyes).</div>`;
}

function rigEditor(c) {
  if (!c.rig) { $("#detail").innerHTML = `<div class="empty">No rig for ${esc(c.name)} yet. Run <code>reels character sheet</code> then <code>reels character pick</code>.</div>`; return; }
  const rig = c.rig;
  $("#detail").innerHTML = `<div class="card"><h3>${esc(c.name)} rig</h3>
    <label>mouth width <input type="range" id="mw" min="10" max="300" /></label>
    <button id="save" class="approve" style="border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;color:#fff">Save rig</button></div>
    <div id="poses"></div>`;
  const draw = () => {
    $("#poses").innerHTML = Object.entries(rig.poses).map(([name, p]) => `
      <div class="rig" data-pose="${esc(name)}"><img src="/characters/${esc(c.id)}/${esc(p.src)}" />
      <div class="s" style="padding:4px 8px">${esc(name)}</div></div>`).join("");
    document.querySelectorAll(".rig").forEach(el => {
      const p = rig.poses[el.dataset.pose], img = el.querySelector("img");
      const place = () => {
        el.querySelectorAll(".dot").forEach(d => d.remove());
        const k = img.clientWidth / p.width;
        const add = (x, y, cls) => { const d = document.createElement("div"); d.className = "dot " + cls; d.style.left = x*k + "px"; d.style.top = y*k + "px"; el.appendChild(d); };
        add(p.mouth.x, p.mouth.y, "mouth");
        (p.eyes || []).forEach(e => add(e.x, e.y, "eye"));
      };
      img.onload = place; if (img.complete) place();
      img.onclick = (ev) => {
        const k = p.width / img.clientWidth, x = ev.offsetX * k, y = ev.offsetY * k;
        if (ev.altKey) p.eyes = [];
        else if (ev.shiftKey) { p.eyes = [...(p.eyes || []), { x, y, r: p.width * 0.04 }].slice(-2); }
        else { p.mouth = { ...p.mouth, x, y }; }
        place();
      };
    });
  };
  const first = Object.values(rig.poses)[0];
  $("#mw").value = first.mouth.w || 60;
  $("#mw").oninput = (e) => { Object.values(rig.poses).forEach(p => p.mouth.w = Number(e.target.value)); };
  $("#save").onclick = () => api(`/api/characters/${c.id}/rig`, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(rig) }).then(() => alert("saved"));
  draw();
}

load();
setInterval(() => { if (!["Characters","Stats"].includes(tab)) load(); }, 15000);
</script>
</body>
</html>
