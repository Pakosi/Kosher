# Offline/CI profile: no models needed. Mock LLM, espeak TTS (falls back to a
# synthetic tone), estimate aligner, built-in icons only.
# Keeps its own state/episodes/cache so mock ideas never leak into the real pool.
paths:
  episodes: state/test/episodes
  state: state/test
  assets_cache: state/test/assets_cache
llm:
  draft:  { backend: mock }
  judge:  { backend: mock }
  polish: { backend: mock }
  vision: { backend: mock }
comfy:
  enabled: false
tts:
  default_engine: espeak
  force_engine: espeak     # falls back to a synthetic tone if espeak-ng is missing
align:
  engine: estimate
render:
  concurrency: 4
qa:
  vision_check: true
  min_seconds: 15
ideas:
  candidates: 10
