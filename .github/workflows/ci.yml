name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng potrace
      - run: cd orchestrator && uv venv -p 3.12 && uv pip install -e ".[dev]"
      - run: orchestrator/.venv/bin/python -m pytest -q tests
  remotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd remotion && npm ci && npm run typecheck && npm test
